name: CivicMemo
options:
  bundleIdPrefix: com.civicmemo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
packages:
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    branch: master
targets:
  CivicMemo:
    type: application
    platform: iOS
    sources:
      - path: CivicMemo
        excludes:
          - "Resources/Fonts/Montserrat/*.ttf"
          - "Resources/Fonts/Montserrat/LICENSE"
    resources:
      - path: CivicMemo/Resources/Fonts/Montserrat/Montserrat-Regular.ttf
      - path: CivicMemo/Resources/Fonts/Montserrat/Montserrat-Medium.ttf
      - path: CivicMemo/Resources/Fonts/Montserrat/Montserrat-SemiBold.ttf
      - path: CivicMemo/Resources/Fonts/Montserrat/Montserrat-Bold.ttf
      - path: CivicMemo/Resources/Fonts/Montserrat/LICENSE
    dependencies:
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.civicmemo.desk
        PRODUCT_NAME: CivicMemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CivicMemo/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: CivicMemo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIImageName: Splash
        INFOPLIST_KEY_UILaunchScreen_UIColorName: CivicIce
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSCameraUsageDescription: CivicMemo uses the camera only to read a package barcode so a desk memo can be filled from the carton.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
  CivicMemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CivicMemoTests
    dependencies:
      - target: CivicMemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.civicmemo.desk.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
schemes:
  CivicMemo:
    build:
      targets:
        CivicMemo: all
        CivicMemoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CivicMemoTests
    archive:
      config: Release
